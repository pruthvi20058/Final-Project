services:
  # ── Backend (Node.js + Python ML) ──────────────────────────────────────────
  - type: web
    name: mediagent-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && pip install -r requirements.txt
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
    autoDeploy: true
