services:
  # ── Backend (Node.js + Python ML) ──────────────────────────────────────────
  - type: web
    name: mediagent-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm rebuild better-sqlite3 && pip install -r requirements.txt || pip install scikit-learn shap pandas numpy joblib openpyxl
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true
