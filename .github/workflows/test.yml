name: Run Tests and Validation

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Install backend dependencies
        run: |
          cd server
          npm ci

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci

      - name: Run backend comprehensive tests
        env:
          JWT_SECRET: test-secret-key-for-ci-32-chars-long
        run: |
          cd server
          npm run test:backend

      - name: Run end-to-end workflow tests
        env:
          JWT_SECRET: test-secret-key-for-ci-32-chars-long
        run: |
          cd server
          npm run test:e2e

      - name: Run OCR / lab extraction tests
        run: |
          cd server
          npm run test:ocr

      - name: Run RAG evaluation tests
        run: |
          cd server
          npm run test:rag

      - name: Run security tests
        run: |
          cd server
          npm run test:security

      - name: Run performance tests
        run: |
          cd server
          npm run test:performance

      - name: Run E4 ML reliability tests
        env:
          JWT_SECRET: test-secret-key-for-ci-32-chars-long
        run: |
          cd server
          node tests/test-e4-ml-reliability.js
      - name: Run ML model validation tests
        run: |
          cd server
          python3 tests/test-ml-model-validation.py

      - name: Run NLP / multilingual evaluation
        run: |
          cd server
          python3 tests/test-nlp-multilingual.py

      - name: Run frontend unit tests
        run: |
          cd client
          npm run test

      - name: Build frontend for production
        run: |
          cd client
          npm run build
